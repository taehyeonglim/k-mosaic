name: Build and verify

# 검증 → 정적 빌드 공통 단계. deploy.yml(main 푸시)과 ci.yml(PR)이 함께 호출한다.
# 두 워크플로에 단계를 복제하면 한쪽만 고쳐져 어긋난다 — 단계는 여기에만 둔다.
#
# 보안 설계상 이 워크플로에는 KOSIS_API_KEY 가 필요하지 않다.
# 웹 앱은 커밋된 스냅숏(data/snapshots/)만 읽고 런타임에 외부 API 를 호출하지 않는다.
# (docs/adr/001-data-ingestion-architecture.md)

on:
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: 빌드 산출물(out/)을 Pages 배포용 아티팩트로 올린다
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 버전을 여기에 적지 않는다. package.json 의 `packageManager` 가 단일 출처이며,
      # 양쪽에 적으면 action 이 모호성을 이유로 거부한다 (ERR_PNPM_BAD_PM_VERSION 예방).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 타입체크
        run: pnpm typecheck

      - name: 린트
        run: pnpm lint

      - name: 단위·통합 테스트
        run: pnpm test

      # PR 에서는 base 브랜치의 스냅숏을 비교 기준으로 넘겨 연도 커버리지 축소(V8·F5)를 잡는다.
      # 비교 기준이 없으면 검증기는 커밋된 파일 자신과 비교하므로 축소를 볼 수 없다.
      # checkout 은 fetch-depth 1 이라 base 브랜치를 따로 받아야 한다.
      - name: 비교 기준 스냅숏 준비 (PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          mkdir -p "$RUNNER_TEMP/base"
          for name in multicultural-students foreign-students; do
            path="data/snapshots/$name.v1.json"
            if git cat-file -e "FETCH_HEAD:$path" 2>/dev/null; then
              git show "FETCH_HEAD:$path" > "$RUNNER_TEMP/base/$name.v1.json"
            fi
          done

      # 검증 게이트 — 실패하면 배포하지 않는다.
      # 오염된 데이터가 공개되는 것보다 배포가 멈추는 편이 낫다.
      - name: 데이터 검증 — 다문화학생
        run: |
          base="$RUNNER_TEMP/base/multicultural-students.v1.json"
          if [ -f "$base" ]; then pnpm data:validate --previous "$base"; else pnpm data:validate; fi

      - name: 데이터 검증 — 대학 외국인 유학생
        run: |
          base="$RUNNER_TEMP/base/foreign-students.v1.json"
          if [ -f "$base" ]; then pnpm data:validate-foreign --previous "$base"; else pnpm data:validate-foreign; fi

      - name: 빌드 (정적 내보내기)
        env:
          # 프로젝트 페이지(username.github.io/k-mosaic)용 경로 접두사.
          # 커스텀 도메인이나 사용자 페이지로 바꾸면 이 값을 비운다.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: pnpm build

      # Jekyll 은 밑줄로 시작하는 디렉터리(_next/)를 무시한다.
      # 이 파일이 없으면 CSS·JS 가 전부 404 가 된다.
      - name: .nojekyll 추가
        run: touch out/.nojekyll

      # basePath 누락 링크 검사 — 일반 <a href="/..."> 는 basePath 를 붙이지 않아
      # 프로젝트 페이지에서 404 가 된다 (실제 발생했던 회귀: 헤더 '데이터 출처' 링크).
      # 로컬 E2E 는 basePath 없이 돌기 때문에 이 유형을 잡지 못한다 — 여기서 잡는다.
      - name: basePath 누락 링크 검사
        run: |
          BAD=$(grep -rhoE 'href="/(sources|foreign-students)[/"#]' out --include='*.html' | sort -u || true)
          if [ -n "$BAD" ]; then
            echo "::error::basePath 가 붙지 않은 내부 링크 발견 — next/link 대신 일반 <a> 를 쓴 곳이 있다"
            echo "$BAD"
            exit 1
          fi
          echo "내부 링크 basePath 검사 통과"

      # 빌드 산출물에 비밀정보가 없는지 확인한다.
      # 이 워크플로에는 키가 없으므로 통상 무의미하지만, 실수로 커밋된 키를 잡는 최후 방어선이다.
      - name: 비밀정보 스캔
        run: npx tsx scripts/security/scan-secrets.ts

      - if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
