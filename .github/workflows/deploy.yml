name: Deploy to GitHub Pages

# 정적 내보내기(out/)를 GitHub Pages 로 배포한다.
# 검증·빌드 단계는 build.yml 에 있다 — PR 검사(ci.yml)와 같은 단계를 공유한다.
#
# 데이터 갱신은 연 1회 로컬에서 `pnpm data:refresh` 로 수행하고 결과를 커밋한다.
# CI 에서 자동 갱신하지 않는 이유는 데이터 변경이 사람의 확인을 거쳐야 하기 때문이다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 하나씩. 진행 중인 배포를 취소하지 않는다(부분 배포 방지).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      upload-pages-artifact: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
