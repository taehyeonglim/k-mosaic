name: Deploy to GitHub Pages

# 정적 내보내기(out/)를 GitHub Pages 로 배포한다.
#
# 보안 설계상 이 워크플로에는 KOSIS_API_KEY 가 필요하지 않다.
# 웹 앱은 커밋된 스냅숏(data/snapshots/)만 읽고 런타임에 외부 API 를 호출하지 않는다.
# (docs/adr/001-data-ingestion-architecture.md)
#
# 데이터 갱신은 연 1회 로컬에서 `pnpm data:refresh` 로 수행하고 결과를 커밋한다.
# CI 에서 자동 갱신하지 않는 이유는 데이터 변경이 사람의 확인을 거쳐야 하기 때문이다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 하나씩. 진행 중인 배포를 취소하지 않는다(부분 배포 방지).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 타입체크
        run: pnpm typecheck

      - name: 린트
        run: pnpm lint

      - name: 단위·통합 테스트
        run: pnpm test

      # 검증 게이트 — 실패하면 배포하지 않는다.
      # 오염된 데이터가 공개되는 것보다 배포가 멈추는 편이 낫다.
      - name: 데이터 검증
        run: pnpm data:validate

      - name: 빌드 (정적 내보내기)
        env:
          # 프로젝트 페이지(username.github.io/k-mosaic)용 경로 접두사.
          # 커스텀 도메인이나 사용자 페이지로 바꾸면 이 값을 비운다.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: pnpm build

      # Jekyll 은 밑줄로 시작하는 디렉터리(_next/)를 무시한다.
      # 이 파일이 없으면 CSS·JS 가 전부 404 가 된다.
      - name: .nojekyll 추가
        run: touch out/.nojekyll

      # 빌드 산출물에 비밀정보가 없는지 확인한다.
      # 이 워크플로에는 키가 없으므로 통상 무의미하지만, 실수로 커밋된 키를 잡는 최후 방어선이다.
      - name: 비밀정보 스캔
        run: npx tsx scripts/security/scan-secrets.ts

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
