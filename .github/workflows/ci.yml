name: CI

# PR 검사 — main 에 머지되기 전에 배포와 같은 검증·빌드 단계(build.yml)를 돌린다.
# 배포 워크플로는 main 푸시 때만 돌기 때문에, 이 검사가 없으면 결함이 머지된 뒤에야 드러난다.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# 같은 PR 에 새 커밋이 오면 이전 검사는 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml

  # E2E·접근성(axe) — 키 없이 돈다. 배포 워크플로에는 넣지 않는다(머지 전 PR 에서 막는다).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Playwright 브라우저 설치
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E·접근성 테스트
        run: pnpm test:e2e

      - name: 실패 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
