name: CI

# PR 검사 — main 에 머지되기 전에 배포와 같은 검증·빌드 단계(build.yml)를 돌린다.
# 배포 워크플로는 main 푸시 때만 돌기 때문에, 이 검사가 없으면 결함이 머지된 뒤에야 드러난다.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# 같은 PR 에 새 커밋이 오면 이전 검사는 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
