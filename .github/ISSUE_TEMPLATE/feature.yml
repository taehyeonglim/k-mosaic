name: 기능 제안
description: 새 기능이나 개선 아이디어
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 해결하나요?
      description: 누가, 어떤 상황에서, 무엇을 하려는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
    validations:
      required: true
  - type: checkboxes
    id: ethics
    attributes:
      label: 윤리 요구사항
      description: K-MOSAIC은 다문화학생을 결손집단으로 표현하지 않고, 높은 비율에 경고색을 쓰지 않으며, 순위를 교육의 우열로 제시하지 않습니다.
      options:
        - label: 제안이 위 원칙과 충돌하지 않는지 확인했습니다
          required: true
